name: Polar HR Calcs

# Runs at minute 8 and 38 of every hour (a 30 minute cadence, offset by 8 minutes).
# Note: GitHub Actions cron is evaluated in UTC. Minute based schedules are
# unaffected by timezone, and scheduled runs can be delayed under GitHub load.
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  run_polar_hr_calcs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # setup-r-dependencies caches the installed library across runs, keyed on
      # the package list below, so packages are only rebuilt when this list
      # changes. smartabaseR is installed here too (pak understands the
      # owner/repo GitHub shorthand) so it is cached alongside the rest.
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          # Authenticate the GitHub API call so it uses the Actions token
          # rather than the rate limited bundled PAT.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          packages: |
            any::dplyr
            any::purrr
            any::readr
            any::dotenv
            any::lubridate
            Teamworksapp/smartabaseR

      - name: Run Polar HR calcs
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SB_URL: ${{ secrets.SB_URL }}
          SB_ATHLETE_GROUP: ${{ secrets.SB_ATHLETE_GROUP }}
        run: Rscript polar_hr_calcs.R
