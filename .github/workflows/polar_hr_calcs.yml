name: Polar HR Calcs

# Runs at minute 8 and 38 of every hour (a 30 minute cadence, offset by 8 minutes).
# Note: GitHub Actions cron is evaluated in UTC. Minute based schedules are
# unaffected by timezone, and scheduled runs can be delayed under GitHub load.
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  run_polar_hr_calcs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # setup-uv caches downloaded packages across runs, keyed on uv.lock
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # installs the Python version in .python-version and the locked deps
      - name: Install dependencies
        run: uv sync --locked

      - name: Run Polar HR calcs
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SB_URL: ${{ secrets.SB_URL }}
          SB_ATHLETE_GROUP: ${{ secrets.SB_ATHLETE_GROUP }}
        run: uv run polar_hr_calcs.py
